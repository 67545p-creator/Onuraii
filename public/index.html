
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Onur AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#101114;color:#f5f5f7;font-family:Arial,sans-serif}
header{padding:17px 20px;border-bottom:1px solid #292a30;font-size:20px;font-weight:700}
#messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.message{max-width:850px;width:fit-content;padding:13px 15px;border-radius:16px;background:#202127;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#343640}
.assistant{align-self:flex-start}
.result{display:block;width:100%;max-width:600px;height:auto;border-radius:12px;margin-top:8px}
.download{display:inline-block;margin-top:10px;color:#b8caff;text-decoration:none}
#status{padding:0 18px 8px;min-height:18px;color:#bcbcc5;font-size:13px}
form{display:flex;gap:9px;padding:12px;border-top:1px solid #292a30;background:#151619}
input{flex:1;min-width:0;padding:15px;border:1px solid #383941;border-radius:13px;background:#222329;color:white;font-size:16px;outline:none}
button{padding:0 18px;border:0;border-radius:13px;background:#777dff;color:white;font-weight:bold}
button:disabled{opacity:.55}
</style>
</head>
<body>
<header>Onur AI</header>
<main id="messages">
<div class="message assistant">Merhaba! Sana nasıl yardımcı olabilirim?</div>
</main>
<div id="status" aria-live="polite"></div>
<form id="form">
<input id="prompt" placeholder="Mesaj yaz veya @gorselolustur El Primo yaz..." autocomplete="off" required>
<button id="send" type="submit">Gönder</button>
</form>
<script>
const form=document.getElementById("form");
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
const statusBox=document.getElementById("status");
const send=document.getElementById("send");

function addMessage(text,role="assistant"){
  const el=document.createElement("div");
  el.className="message "+role;
  el.textContent=text;
  messages.appendChild(el);
  messages.scrollTop=messages.scrollHeight;
}

function addImage(data){
  const box=document.createElement("div");
  box.className="message assistant";
  const img=document.createElement("img");
  img.className="result";
  img.src=data;
  img.alt="Oluşturulan PNG";
  const link=document.createElement("a");
  link.className="download";
  link.href=data;
  link.download="onur-ai.png";
  link.textContent="PNG olarak indir";
  box.append(img,link);
  messages.appendChild(box);
  messages.scrollTop=messages.scrollHeight;
}

async function requestJson(url,body){
  const response=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"İstek başarısız.");
  return data;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const message=input.value.trim();
  if(!message)return;

  addMessage(message,"user");
  input.value="";
  input.disabled=true;
  send.disabled=true;

  const isImage=/^@gorselolustur\b/i.test(message);
  statusBox.textContent=isImage?"Görsel oluşturuluyor...":"";

  try{
    if(isImage){
      const data=await requestJson("/api/image",{prompt:message});
      addImage(data.image);
    }else{
      const data=await requestJson("/api/chat",{message});
      addMessage(data.text||"Yanıt alınamadı.");
    }
  }catch(error){
    addMessage(error.message||"Bir hata oluştu.");
  }finally{
    input.disabled=false;
    send.disabled=false;
    statusBox.textContent="";
    input.focus();
  }
});
</script>
</body>
</html>
