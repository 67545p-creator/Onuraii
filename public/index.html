
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Onur AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #101114;
  color: #f5f5f7;
  font-family: Arial, sans-serif;
}

header {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #292a30;
  font-size: 21px;
  font-weight: 700;
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  max-width: 850px;
  width: fit-content;
  padding: 13px 15px;
  border-radius: 16px;
  background: #202127;
  overflow-wrap: anywhere;
  line-height: 1.55;
  white-space: pre-wrap;
}

.user {
  align-self: flex-end;
  background: #343640;
}

.assistant {
  align-self: flex-start;
}

.result {
  display: block;
  width: 100%;
  max-width: 600px;
  height: auto;
  border-radius: 12px;
  margin-top: 8px;
}

.download {
  display: inline-block;
  margin-top: 12px;
  color: #b8caff;
  text-decoration: none;
}

.download:hover {
  text-decoration: underline;
}

#status {
  padding: 0 18px 8px;
  min-height: 8px;
  color: #bcbcc5;
  font-size: 13px;
}

form {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px;
  border-top: 1px solid #292a30;
  background: #151619;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 1px solid #383941;
  border-radius: 13px;
  background: #222329;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #777dff;
}

button {
  min-height: 46px;
  padding: 0 17px;
  border: 0;
  border-radius: 13px;
  background: #777dff;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

button:hover {
  filter: brightness(1.1);
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

#imageButton {
  background: #292a35;
  border: 1px solid #41424e;
}

@media (max-width: 600px) {
  form {
    flex-wrap: wrap;
  }

  #imageButton {
    flex: 1 1 100%;
  }

  input {
    flex: 1 1 55%;
  }

  #send {
    flex: 0 0 auto;
  }

  #messages {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header>Onur AI</header>

<main id="messages">
  <div class="message assistant">Merhaba! Ben Onur AI. Sana nasıl yardımcı olabilirim?</div>
</main>

<div id="status" aria-live="polite"></div>

<form id="form">
  <button id="imageButton" type="button">＋ Görsel Oluştur</button>

  <input
    id="prompt"
    placeholder="Mesajını yaz..."
    autocomplete="off"
    required
  >

  <button id="send" type="submit">Gönder</button>
</form>

<script>
const form = document.getElementById("form");
const input = document.getElementById("prompt");
const messages = document.getElementById("messages");
const statusBox = document.getElementById("status");
const send = document.getElementById("send");
const imageButton = document.getElementById("imageButton");

let imageMode = false;

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(text, role = "assistant") {
  const element = document.createElement("div");
  element.className = "message " + role;
  element.textContent = text;
  messages.appendChild(element);
  scrollToBottom();
}

function addImage(dataUrl) {
  const box = document.createElement("div");
  box.className = "message assistant";

  const title = document.createElement("div");
  title.textContent = "Oluşturulan görsel";

  const img = document.createElement("img");
  img.className = "result";
  img.src = dataUrl;
  img.alt = "Onur AI tarafından oluşturulan PNG görseli";

  const link = document.createElement("a");
  link.className = "download";
  link.href = dataUrl;
  link.download = "onur-ai.png";
  link.textContent = "PNG olarak indir";

  box.appendChild(title);
  box.appendChild(img);
  box.appendChild(link);

  messages.appendChild(box);
  scrollToBottom();
}

async function post(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "İstek başarısız oldu."
    );
  }

  return data;
}

imageButton.addEventListener("click", () => {
  imageMode = true;
  input.value = "@gorselolustur ";
  input.placeholder = "Hangi karakteri çizelim?";
  input.focus();
});

input.addEventListener("input", () => {
  if (!input.value.trim()) {
    imageMode = false;
    input.placeholder = "Mesajını yaz...";
    return;
  }

  imageMode = /^@gorselolustur\b/i.test(input.value.trim());
  input.placeholder = imageMode
    ? "Çizilecek karakteri yaz..."
    : "Mesajını yaz...";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = input.value.trim();

  if (!message) return;

  const isImage =
    imageMode || /^@gorselolustur\b/i.test(message);

  addMessage(message, "user");

  input.value = "";
  input.disabled = true;
  send.disabled = true;
  imageButton.disabled = true;

  statusBox.textContent = isImage
    ? "Görsel oluşturuluyor..."
    : "";

  try {
    if (isImage) {
      const character = message.replace(
        /^@gorselolustur\s*/i,
        ""
      ).trim();

      if (!character) {
        throw new Error(
          "Önce çizilecek karakterin adını yaz."
        );
      }

      const data = await post("/api/image", {
        prompt: "@gorselolustur " + character
      });

      if (!data.image) {
        throw new Error("Sunucu görsel döndürmedi.");
      }

      addImage(data.image);
    } else {
      const data = await post("/api/chat", {
        message
      });

      addMessage(
        data.text || "Yanıt alınamadı.",
        "assistant"
      );
    }
  } catch (error) {
    addMessage(
      error.message || "Bir hata oluştu.",
      "assistant"
    );
  } finally {
    input.disabled = false;
    send.disabled = false;
    imageButton.disabled = false;
    imageMode = false;
    input.placeholder = "Mesajını yaz...";
    statusBox.textContent = "";
    input.focus();
  }
});
</script>

</body>
</html>
