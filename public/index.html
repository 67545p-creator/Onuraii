
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Onur AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#101114;color:#f5f5f5;font-family:Arial,sans-serif}
header{height:60px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #303036;font-size:20px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.message{max-width:95%;padding:12px 15px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#343640}
.assistant{align-self:flex-start;background:#202127}
.message img{display:block;width:100%;max-width:512px;height:auto;margin-top:8px;border-radius:10px}
.download{display:inline-block;margin-top:10px;color:#b9c9ff;text-decoration:none}
.download:hover{text-decoration:underline}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid #303036;background:#101114}
input{flex:1;min-width:0;padding:13px;border:1px solid #41424b;border-radius:12px;background:#202127;color:white;font-size:16px;outline:none}
input:focus{border-color:#7885ff}
button{border:0;border-radius:12px;padding:12px 15px;background:#5865f2;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#plusWrap{position:relative}
#plusButton{background:#30313a;font-size:22px;min-width:45px}
#menu{display:none;position:absolute;bottom:55px;left:0;min-width:190px;padding:6px;background:#262730;border:1px solid #41424b;border-radius:12px;z-index:2}
#menu button{width:100%;text-align:left;background:transparent}
#menu button:hover{background:#383945}
.status{opacity:.8}
</style>
</head>
<body>
<header>Onur AI</header>

<main id="chat" aria-live="polite"></main>

<form id="composer">
  <div id="plusWrap">
    <button id="plusButton" type="button" aria-label="Komutlar">+</button>
    <div id="menu">
      <button id="imageCommand" type="button">@gorselolustur</button>
    </div>
  </div>
  <input id="messageInput" placeholder="Mesajını yaz..." autocomplete="off" required>
  <button id="sendButton" type="submit">Gönder</button>
</form>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("composer");
const input=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const menu=document.getElementById("menu");

document.getElementById("plusButton").addEventListener("click",()=>{
  menu.style.display=menu.style.display==="block"?"none":"block";
});

document.getElementById("imageCommand").addEventListener("click",()=>{
  input.value="@gorselolustur ";
  input.focus();
  menu.style.display="none";
});

function addMessage(text,role="assistant"){
  const el=document.createElement("div");
  el.className="message "+role;
  el.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
  return el;
}

function safeColor(value,fallback="#777777"){
  if(value==="none")return "none";
  return typeof value==="string"&&/^#[0-9a-fA-F]{6}$/.test(value)
    ?value:fallback;
}

function n(value){
  const x=Number(value);
  return Number.isFinite(x)?Math.max(-1000,Math.min(512,x)):0;
}

function renderLayer(layer,index){
  const fill=safeColor(layer.fill,"#777777");
  const stroke=safeColor(layer.stroke,"none");
  const sw=Math.max(0,Math.min(30,n(layer.strokeWidth??1)));
  const common=`fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;

  switch(layer.type){
    case "circle":
      return `<circle cx="${n(layer.cx)}" cy="${n(layer.cy)}" r="${Math.max(0,n(layer.r))}" ${common}/>`;
    case "ellipse":
      return `<ellipse cx="${n(layer.cx)}" cy="${n(layer.cy)}" rx="${Math.max(0,n(layer.rx))}" ry="${Math.max(0,n(layer.ry))}" ${common}/>`;
    case "rect":
      return `<rect x="${n(layer.x)}" y="${n(layer.y)}" width="${Math.max(0,n(layer.width))}" height="${Math.max(0,n(layer.height))}" ${common}/>`;
    case "line":
      return `<line x1="${n(layer.x1)}" y1="${n(layer.y1)}" x2="${n(layer.x2)}" y2="${n(layer.y2)}" stroke="${stroke}" stroke-width="${sw}"/>`;
    case "polygon":
      if(typeof layer.points==="string"&&layer.points.length<=3000&&/^[0-9+.,\s-]+$/.test(layer.points)){
        return `<polygon points="${layer.points}" ${common}/>`;
      }
      return "";
    case "path":
      if(typeof layer.d==="string"&&layer.d.length<=3000&&/^[0-9MmLlHhVvCcQqZz+.,\s-]+$/.test(layer.d)){
        return `<path d="${layer.d}" ${common}/>`;
      }
      return "";
    case "gradient":{
      const id="grad"+index;
      const c1=safeColor(layer.color1,"#ffffff");
      const c2=safeColor(layer.color2,"#777777");
      const vertical=layer.direction==="vertical";
      const direction=vertical
        ?'x1="0%" y1="0%" x2="0%" y2="100%"'
        :'x1="0%" y1="0%" x2="100%" y2="100%"';
      return `<defs><linearGradient id="${id}" ${direction}><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><rect x="${n(layer.x)}" y="${n(layer.y)}" width="${Math.max(0,n(layer.width))}" height="${Math.max(0,n(layer.height))}" fill="url(#${id})"/>`;
    }
    case "text":{
      const text=String(layer.text||"").slice(0,100)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
      return `<text x="${n(layer.x)}" y="${n(layer.y)}" fill="${safeColor(layer.fill,"#222222")}" font-size="${Math.max(1,Math.min(100,n(layer.fontSize||20)))}" font-family="Arial,sans-serif">${text}</text>`;
    }
    default:
      return "";
  }
}

async function renderPng(plan){
  if(!plan||!Array.isArray(plan.layers)){
    throw new Error("Gemini'nin oluşturduğu kalıp geçersiz.");
  }

  const background=safeColor(plan.background,"#ffffff");
  const layers=plan.layers.slice(0,120).map(renderLayer).join("");
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" fill="${background}"/>${layers}</svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));

  try{
    const img=new Image();
    img.src=url;
    await img.decode();

    const canvas=document.createElement("canvas");
    canvas.width=512;
    canvas.height=512;

    const ctx=canvas.getContext("2d");
    if(!ctx)throw new Error("Canvas kullanılamıyor.");

    ctx.drawImage(img,0,0);
    return canvas.toDataURL("image/png");
  }finally{
    URL.revokeObjectURL(url);
  }
}

function showImage(container,src){
  const img=document.createElement("img");
  img.src=src;
  img.alt="Onur AI tarafından oluşturulan görsel";
  container.appendChild(img);

  const link=document.createElement("a");
  link.className="download";
  link.href=src;
  link.download="onur-ai-gorsel.png";
  link.textContent="PNG indir";
  container.appendChild(link);
}

async function createImage(prompt,status){
  status.textContent="Görsel kalıbı hazırlanıyor...";

  const response=await fetch("/api/drawing-plan",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });

  const data=await response.json();

  if(!response.ok){
    throw new Error(data.error||"Kalıp JSON oluşturulamadı.");
  }

  status.textContent="Kalıp görsele dönüştürülüyor...";
  const png=await renderPng(data.plan);
  status.textContent="";
  showImage(status,png);
}

async function sendMessage(message){
  sendButton.disabled=true;
  input.disabled=true;

  try{
    const match=message.match(/^@gorselolustur\b([\s\S]*)/i);

    if(match){
      addMessage(message,"user");
      const prompt=match[1].trim();

      if(!prompt){
        addMessage("Lütfen görsel tarifini de yaz.");
        return;
      }

      const status=addMessage("Görsel oluşturuluyor...");
      status.classList.add("status");
      await createImage(prompt,status);
    }else{
      addMessage(message,"user");

      const response=await fetch("/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message})
      });

      const data=await response.json();

      if(!response.ok){
        throw new Error(data.error||"Yanıt alınamadı.");
      }

      addMessage(data.text||"Yanıt alınamadı.");
    }
  }catch(error){
    addMessage("Hata: "+error.message);
  }finally{
    sendButton.disabled=false;
    input.disabled=false;
    input.focus();
    chat.scrollTop=chat.scrollHeight;
  }
}

form.addEventListener("submit",async event=>{
  event.preventDefault();
  const message=input.value.trim();
  if(!message)return;

  input.value="";
  menu.style.display="none";
  await sendMessage(message);
});
</script>
</body>
</html>
