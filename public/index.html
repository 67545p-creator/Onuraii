
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onur AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#101114;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:16px;border-bottom:1px solid #303036;font-size:20px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.message{max-width:90%;padding:12px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#343640}
.assistant{align-self:flex-start;background:#202127}
.message img{display:block;max-width:100%;height:auto;margin-top:10px;border-radius:10px}
.download{display:inline-block;margin-top:10px;color:#b9c9ff}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid #303036}
input{flex:1;min-width:0;padding:13px;border:1px solid #41424b;border-radius:12px;background:#202127;color:white;font-size:16px;outline:none}
button{border:0;border-radius:12px;padding:12px 15px;background:#5865f2;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#plusWrap{position:relative}
#plusButton{background:#30313a;font-size:22px}
#menu{display:none;position:absolute;bottom:54px;left:0;min-width:190px;padding:6px;background:#262730;border:1px solid #41424b;border-radius:12px}
#menu button{width:100%;text-align:left;background:transparent}
.status{opacity:.8;font-style:italic}
</style>
</head>
<body>
<header>Onur AI</header>

<main id="chat" aria-live="polite">
<div class="message assistant">Merhaba! Ben Onur AI. Sana nasıl yardımcı olabilirim?</div>
</main>

<form id="composer">
<div id="plusWrap">
<button id="plusButton" type="button" aria-label="Menüyü aç">+</button>
<div id="menu">
<button id="imageCommand" type="button">@gorselolustur</button>
</div>
</div>
<input id="messageInput" placeholder="Mesajını yaz..." autocomplete="off" required>
<button id="sendButton" type="submit">Gönder</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("composer");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const menu = document.getElementById("menu");

document.getElementById("plusButton").addEventListener("click", () => {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
});

document.getElementById("imageCommand").addEventListener("click", () => {
  input.value = "@gorselolustur ";
  input.focus();
  menu.style.display = "none";
});

function addMessage(text, role = "assistant") {
  const el = document.createElement("div");
  el.className = `message ${role}`;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function sendMessage(message) {
  sendButton.disabled = true;
  input.disabled = true;

  try {
    if (/@gorselolustur\b/i.test(message)) {
      const prompt = message.replace(/@gorselolustur\b/i, "").trim();
      addMessage(message, "user");

      if (!prompt) {
        addMessage("Görsel açıklamasını yaz.");
        return;
      }

      const status = addMessage("Görsel oluşturuluyor...");
      status.classList.add("status");

      const response = await fetch("/api/generate-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Görsel oluşturulamadı.");

      status.classList.remove("status");
      status.textContent = data.text || "Görsel oluşturuldu.";

      const img = document.createElement("img");
      img.src = data.image;
      img.alt = "Oluşturulan görsel";
      status.appendChild(img);

      const link = document.createElement("a");
      link.className = "download";
      link.href = data.image;
      link.download = "onur-ai-gorsel.png";
      link.textContent = "Görseli indir";
      status.appendChild(link);
    } else {
      addMessage(message, "user");

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Sohbet başarısız.");

      addMessage(data.text || "Yanıt alınamadı.");
    }
  } catch (error) {
    addMessage("Hata: " + error.message);
  } finally {
    sendButton.disabled = false;
    input.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  input.value = "";
  menu.style.display = "none";
  await sendMessage(message);
});
</script>
</body>
</html>
