
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Onur AI</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101114;
  --panel: #18191e;
  --panel2: #222329;
  --text: #f5f5f7;
  --muted: #a4a5ae;
  --accent: #a78bfa;
  --border: #303138;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, textarea, select { font: inherit; }
button { cursor: pointer; }
header {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px;
  border-bottom: 1px solid var(--border);
  background: rgba(16,17,20,.96);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 18px;
  font-weight: 750;
}
.logo {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#a78bfa,#6366f1);
  color: white;
  font-weight: 900;
}
.icon-button {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--panel);
  color: white;
  font-size: 20px;
}
#chat {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 22px 16px 30px;
}
.messages {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 23px;
}
.welcome {
  margin: auto;
  padding: 45px 10px;
  text-align: center;
}
.welcome-logo {
  width: 70px;
  height: 70px;
  margin: 0 auto 22px;
  border-radius: 23px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#a78bfa,#6366f1);
  font-size: 35px;
  font-weight: 900;
}
.welcome h1 {
  margin: 0 0 10px;
  font-size: clamp(27px,6vw,38px);
  letter-spacing: -1px;
}
.welcome p {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}
.message {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: appear .18s ease-out;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 800;
  background: var(--panel2);
}
.message.assistant .avatar {
  background: linear-gradient(135deg,#a78bfa,#6366f1);
}
.message-content {
  min-width: 0;
  flex: 1;
  padding-top: 5px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}
.message-content p { margin: 0 0 10px; }
.message-content p:last-child { margin-bottom: 0; }
.message.user .message-content {
  background: #25262d;
  border: 1px solid #303138;
  border-radius: 17px;
  padding: 11px 14px;
  flex: initial;
  max-width: 90%;
}
.message.user { justify-content: flex-end; }
.message.user .avatar { display: none; }
.message.user .message-content { order: -1; }
.message-content pre {
  background: #0b0c0f;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  overflow-x: auto;
  white-space: pre;
}
.message-content code {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: .9em;
}
.message-content img {
  display: block;
  width: 100%;
  max-width: 600px;
  border-radius: 14px;
  margin-top: 12px;
}
.image-actions {
  display: flex;
  gap: 9px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.small-button {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  background: var(--panel);
  color: var(--text);
}
.composer-wrap {
  flex-shrink: 0;
  padding: 10px 14px calc(13px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent,var(--bg) 15%);
}
.composer {
  max-width: 800px;
  margin: 0 auto;
  border: 1px solid #393a43;
  border-radius: 23px;
  background: #1c1d22;
  padding: 10px;
  box-shadow: 0 8px 35px #0002;
}
#prompt {
  width: 100%;
  min-height: 42px;
  max-height: 160px;
  resize: none;
  border: 0;
  outline: 0;
  color: white;
  background: transparent;
  padding: 8px 8px 5px;
  font-size: 16px;
  line-height: 1.5;
}
#prompt::placeholder { color: #999aa5; }
.composer-bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 5px;
}
#style {
  min-width: 0;
  max-width: 155px;
  background: #292a31;
  border: 1px solid #3b3c45;
  border-radius: 12px;
  color: white;
  padding: 9px 8px;
  outline: 0;
  font-size: 13px;
}
.spacer { flex: 1; }
#send {
  height: 42px;
  min-width: 44px;
  border: 0;
  border-radius: 14px;
  padding: 0 15px;
  background: #f5f5f7;
  color: #17171a;
  font-size: 20px;
  font-weight: 800;
}
#send:disabled { opacity: .5; cursor: default; }
#newChat { font-size: 19px; }
@media (min-width: 700px) {
  #chat { padding-top: 30px; }
  .composer-wrap { padding-left: 22px; padding-right: 22px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">
    <div class="logo">O</div>
    <span>Onur AI</span>
  </div>
  <button class="icon-button" id="newChat" title="Yeni sohbet" aria-label="Yeni sohbet">＋</button>
</header>

<main id="chat">
  <div class="messages" id="messages">
    <section class="welcome" id="welcome">
      <div class="welcome-logo">O</div>
      <h1>Nasıl yardımcı olabilirim?</h1>
      <p>Bir şey sor veya hayalindeki görseli tarif et.</p>
    </section>
  </div>
</main>

<div class="composer-wrap">
  <form class="composer" id="form">
    <textarea id="prompt" rows="1" placeholder="Onur AI'ya bir şey sor..." autocomplete="off"></textarea>
    <div class="composer-bottom">
      <select id="style" aria-label="Görsel stili">
        <option value="auto">Otomatik stil</option>
        <option value="realistic">Gerçekçi</option>
        <option value="cartoon">Çizgi film</option>
        <option value="3d">3D</option>
        <option value="anime">Anime</option>
        <option value="horror">Korku</option>
        <option value="pixel">Piksel sanatı</option>
        <option value="sketch">Eskiz</option>
        <option value="fantasy">Fantastik</option>
        <option value="watercolor">Suluboya</option>
      </select>
      <div class="spacer"></div>
      <button id="send" type="submit" aria-label="Gönder">↑</button>
    </div>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $("form");
const promptBox = $("prompt");
const messages = $("messages");
const chat = $("chat");
const sendButton = $("send");
const styleSelect = $("style");

let busy = false;

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function removeWelcome() {
  $("welcome")?.remove();
}

function addMessage(role, text) {
  removeWelcome();

  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "assistant" ? "O" : "S";

  const content = document.createElement("div");
  content.className = "message-content";

  const paragraph = document.createElement("p");
  paragraph.textContent = text;
  content.appendChild(paragraph);

  wrapper.append(avatar, content);
  messages.appendChild(wrapper);
  scrollBottom();

  return { wrapper, content };
}

function addImage(content, dataUrl, filename) {
  const img = document.createElement("img");
  img.src = dataUrl;
  img.alt = filename;
  content.appendChild(img);

  const actions = document.createElement("div");
  actions.className = "image-actions";

  const download = document.createElement("button");
  download.className = "small-button";
  download.textContent = "PNG indir";
  download.onclick = () => {
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = filename;
    a.click();
  };

  const open = document.createElement("button");
  open.className = "small-button";
  open.textContent = "Görseli aç";
  open.onclick = () => window.open(dataUrl, "_blank");

  actions.append(download, open);
  content.appendChild(actions);
  scrollBottom();
}

function safeColor(color, fallback = "#888888") {
  return typeof color === "string" && /^#[0-9a-fA-F]{6}$/.test(color)
    ? color
    : fallback;
}

function renderTemplate(template) {
  return new Promise((resolve, reject) => {
    try {
      const width = 1024;
      const height = 1024;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("Canvas açılamadı.");

      ctx.fillStyle = safeColor(template.background, "#ffffff");
      ctx.fillRect(0, 0, width, height);

      for (const layer of (template.layers || [])) {
        ctx.save();

        ctx.globalAlpha = Math.max(
          0, Math.min(1, Number(layer.opacity ?? 1))
        );

        ctx.fillStyle = safeColor(layer.color);
        ctx.strokeStyle = layer.stroke === "none"
          ? "transparent"
          : safeColor(layer.stroke);
        ctx.lineWidth = Math.max(
          0, Math.min(100, Number(layer.strokeWidth ?? 1))
        );
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        const x = Number(layer.x || 0);
        const y = Number(layer.y || 0);
        const w = Number(layer.width || 0);
        const h = Number(layer.height || 0);

        switch (layer.type) {
          case "rect":
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.fill();
            if (layer.stroke !== "none") ctx.stroke();
            break;

          case "ellipse":
            ctx.beginPath();
            ctx.ellipse(
              x + w / 2,
              y + h / 2,
              Math.abs(w / 2),
              Math.abs(h / 2),
              0, 0, Math.PI * 2
            );
            ctx.fill();
            if (layer.stroke !== "none") ctx.stroke();
            break;

          case "circle":
            ctx.beginPath();
            ctx.arc(
              Number(layer.cx || 0),
              Number(layer.cy || 0),
              Math.abs(Number(layer.r || 0)),
              0, Math.PI * 2
            );
            ctx.fill();
            if (layer.stroke !== "none") ctx.stroke();
            break;

          case "line":
            ctx.beginPath();
            ctx.moveTo(Number(layer.x1 || 0), Number(layer.y1 || 0));
            ctx.lineTo(Number(layer.x2 || 0), Number(layer.y2 || 0));
            ctx.stroke();
            break;

          case "polygon": {
            const points = Array.isArray(layer.points) ? layer.points : [];
            if (points.length >= 3) {
              ctx.beginPath();
              ctx.moveTo(Number(points[0].x), Number(points[0].y));
              for (const point of points.slice(1)) {
                ctx.lineTo(Number(point.x), Number(point.y));
              }
              ctx.closePath();
              ctx.fill();
              if (layer.stroke !== "none") ctx.stroke();
            }
            break;
          }

          case "path": {
            if (typeof layer.d === "string" && layer.d.length < 5000) {
              try {
                const path = new Path2D(layer.d);
                ctx.fill(path);
                if (layer.stroke !== "none") ctx.stroke(path);
              } catch {}
            }
            break;
          }

          case "text":
            ctx.font = "bold 32px system-ui, sans-serif";
            ctx.textBaseline = "top";
            ctx.fillText(String(layer.text || "").slice(0, 200), x, y, 900);
            break;
        }

        ctx.restore();
      }

      resolve(canvas.toDataURL("image/png"));
    } catch (error) {
      reject(error);
    }
  });
}

async function createImage(prompt) {
  const message = addMessage("assistant", "Görsel oluşturuluyor...");
  const { content } = message;

  try {
    const response = await fetch("/api/drawing-plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt,
        style: styleSelect.value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Görsel oluşturulamadı.");
    }

    if (!data.template) {
      throw new Error("Sunucu geçerli bir çizim şablonu döndürmedi.");
    }

    const png = await renderTemplate(data.template);
    content.replaceChildren();

    const title = document.createElement("p");
    title.textContent = data.template.title || "Oluşturulan görsel";
    content.appendChild(title);

    addImage(
      content,
      png,
      "onur-ai-gorsel.png"
    );
  } catch (error) {
    content.replaceChildren();
    const p = document.createElement("p");
    p.textContent = error.message || "Görsel oluşturulamadı.";
    content.appendChild(p);
  }
}

async function sendChat(prompt) {
  const message = addMessage("assistant", "");
  const { content } = message;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: prompt })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Yanıt alınamadı.");
    }

    content.replaceChildren();

    const p = document.createElement("p");
    p.textContent = data.reply || "Yanıt oluşturulamadı.";
    content.appendChild(p);
  } catch (error) {
    content.replaceChildren();

    const p = document.createElement("p");
    p.textContent = error.message || "Bir hata oluştu.";
    content.appendChild(p);
  }

  scrollBottom();
}

async function submitPrompt() {
  if (busy) return;

  const prompt = promptBox.value.trim();
  if (!prompt) return;

  busy = true;
  sendButton.disabled = true;

  addMessage("user", prompt);
  promptBox.value = "";
  promptBox.style.height = "auto";

  try {
    const match = prompt.match(/^@gorselolustur\b\s*([\s\S]*)$/i);

    if (match) {
      const drawingPrompt = match[1].trim();

      if (!drawingPrompt) {
        addMessage(
          "assistant",
          "Örnek: @gorselolustur uçan bir kedi"
        );
      } else {
        await createImage(drawingPrompt);
      }
    } else {
      await sendChat(prompt);
    }
  } finally {
    busy = false;
    sendButton.disabled = false;
    promptBox.focus();
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  submitPrompt();
});

promptBox.addEventListener("input", () => {
  promptBox.style.height = "auto";
  promptBox.style.height = Math.min(promptBox.scrollHeight, 160) + "px";
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    submitPrompt();
  }
});

$("newChat").addEventListener("click", () => {
  messages.replaceChildren();

  const welcome = document.createElement("section");
  welcome.className = "welcome";
  welcome.id = "welcome";

  const logo = document.createElement("div");
  logo.className = "welcome-logo";
  logo.textContent = "O";

  const heading = document.createElement("h1");
  heading.textContent = "Nasıl yardımcı olabilirim?";

  const paragraph = document.createElement("p");
  paragraph.textContent = "Bir şey sor veya hayalindeki görseli tarif et.";

  welcome.append(logo, heading, paragraph);
  messages.appendChild(welcome);

  promptBox.value = "";
  promptBox.focus();
});
</script>
</body>
</html>
